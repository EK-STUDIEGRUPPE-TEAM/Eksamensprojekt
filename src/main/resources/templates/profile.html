<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profil</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/pagefade.css">
</head>
<body>
<header th:replace="~{fragments/fragments :: headerfragment}"></header>
<nav th:replace="~{fragments/fragments :: navfragment('profile')}"></nav>

<main>
    <h1>Min profil</h1>

    <!--
    Denne form bruges til at opdatere brugerens profiloplysninger.
    Når brugeren trykker på "Gem ændringer", sendes data til controllerens
    update-metode.
-->
    <form th:action="@{/user/update/{id}(id=${user.id})}" th:object="${user}" method="post">
        <div class="form-group">
            <label>Navn</label>
            <!--
      Label viser teksten "Navn" på siden.
      Inputfeltet er bundet til user-objektets name-attribut.
      Det betyder, at værdien fra feltet bliver gemt i user.name.
  -->
            <input type="text" th:field="*{name}">
        </div>
        <div class="form-group">
            <label>Email</label>
            <!--
        Emailfeltet viser brugerens email.
        th:field="*{email}" betyder, at feltet er bundet til user.email.
        readonly betyder, at brugeren kan se emailen, men ikke ændre den.
    -->
            <input type="email" th:field="*{email}" readonly>
        </div>
        <div class="form-group">
            <label>Password</label>
            <!--
       Passwordfeltet er bundet til user.password.
       type="password" gør, at passwordet ikke vises som almindelig tekst.
   -->
            <input type="password" th:field="*{password}">
        </div>
        <div class="form-actions">
            <!--
      Denne knap sender formen.
      Fordi method="post", bliver oplysningerne sendt som en POST-request.
  -->
            <button type="submit">Gem ændringer</button>
            <!-- tilbage knap-->
            <a class="btn-back" th:href="@{/dashboard}">Tilbage</a>
        </div>
    </form>

    <br>

    <!--
    Denne form bruges til at slette brugerens profil.
    Når brugeren trykker på "Slet profil", sendes en POST-request
    til controllerens delete-metode med brugerens id i URL'en.
-->
    <form th:action="@{/user/delete/{id}(id=${user.id})}" method="post">
        <!--
        onclick viser en confirm-boks, før profilen slettes.
        Hvis brugeren trykker OK, fortsætter sletningen.
        Hvis brugeren trykker Annuller, bliver formen ikke sendt.
    -->
        <button type="submit" class="btn-danger" onclick="return confirm('Er du sikker på du vil slette din profil?')">
            Slet profil
        </button>
    </form>
</main>
</body>
</html>
