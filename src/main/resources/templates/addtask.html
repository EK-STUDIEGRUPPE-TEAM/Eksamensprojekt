<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Addtask</title>
</head>
<body>
<h1>Tilføj opgave</h1>
<main>

    <!--
    vi bruger form for at modtage input fra brugeren

    th:action fortæller vores th:object som er task
    at modellen skal sendes til vores /save metode
    som ligger i task controller

        method="post" betyder at vi sender
        dataen til vores backend
    -->

    <form
        th:action="@{/task/save}"
        th:object="${task}"
        method="post"
    >
    <table>
    <!--
    herefter bruger vi th:field for at binde brugerinput
    til de forskellige felter i task

    subprojectid og projectid er hidden idet man ikke skal kunne ændre det
    -->
        <input type="hidden" th:field="*{subProjectId}">
        <input type="hidden" name="projectId" th:value="${projectId}">

        <tr>
            <th>Opgavetitel</th>
            <th>Beskrivelse</th>
            <th>Timepris</th>
            <th>Status</th>
        </tr>
        <tr>
            <!-- step tillader decimal tal -->
            <td><input type="text" th:field="*{name}"></td>
            <td><input type="text" th:field="*{description}"></td>
            <td><input type="number" th:field="*{hourlyRate}" min="1" step=".01"></td>
            <td><select th:field="*{status}">
                <option value="TODO">Todo</option>
                <option value="IN_PROGRESS">Aktiv</option>
                <option value="DONE">Færdig</option>
                </select>
            </td>
        </tr>
    </table>
        <!-- Vi mangler status her -->
        <button type="submit">Gem</button>
    </form>
    <a th:href="@{/projects/{id}(id=${projectId})}">Tilbage</a>
</main>
</body>
</html>
