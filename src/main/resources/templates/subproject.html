<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SubProjects</title>
</head>
<body>

<h1>SubProjects</h1>

<table border="1">
    <thead>
    <tr>
        <th>Name</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="subProject : ${subprojects}">
        <td>
            <input type="text"
                   name="name"
                   th:value="${subProject.name}"
                   th:form="'updateForm-' + ${subProject.id}">
        </td>
        <td>
            <form th:id="'updateForm-' + ${subProject.id}"
                  th:action="@{/subproject/update/{projectId}/{id}(projectId=${projectId}, id=${subProject.id})}"
                  method="post">
                <button type="submit">Update</button>
            </form>

            <form th:action="@{/subproject/delete/{projectId}/{id}(projectId=${projectId}, id=${subProject.id})}"
                  method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<h2>Create SubProject</h2>

<form th:action="@{/subproject/add/{projectId}(projectId=${projectId})}"
      th:object="${newSubProject}"
      method="post">

    <label>Name:</label>
    <input type="text" th:field="*{name}" required>

    <br><br>

    <button type="submit">Create</button>
</form>

</body>
</html>
