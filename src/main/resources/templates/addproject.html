<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Gør siden responsiv, så layoutet tilpasser sig mobil, tablet og computer -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret projekt</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/forms.css">
</head>

<body>

<header th:replace="~{fragments/fragments :: headerfragment}"></header>

<nav th:replace="~{fragments/fragments :: navfragment('projects')}"></nav>

<main>

    <h1>Opret projekt</h1>

    <div class="error-msg" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/projects/save}" th:object="${project}" method="post">

        <div class="form-group">

            <label>Navn</label>

            <input type="text" th:field="*{name}" maxlength="30" required>

        </div>

        <div class="form-group">

            <label>Beskrivelse</label>

            <input type="text" th:field="*{description}" maxlength="60">

        </div>

        <div class="form-group">

            <label>Deadline</label>

            <input type="date" th:field="*{deadline}" required>

        </div>

        <div class="form-group">

            <label>Budget (KR.)</label>

            <input type="text" th:field="*{budget}">

        </div>

        <div class="form-group">

            <label>Status</label>

            <select th:field="*{status}" required>

                <option value="TODO">Todo</option>

                <option value="IN_PROGRESS">Aktiv</option>

                <option value="DONE">Færdig</option>

            </select>

        </div>

        <div class="form-actions">

            <button type="submit">Opret projekt</button>

            <a class="btn-cancel" th:href="@{/projects}">Annuller</a>

        </div>

    </form>

</main>

</body>

</html>
