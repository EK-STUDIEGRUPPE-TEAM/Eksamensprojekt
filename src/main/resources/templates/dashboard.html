<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Gør siden responsiv, så layoutet tilpasser sig mobil, tablet og computer -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

<header th:replace="~{fragments/fragments :: headerfragment}"></header>


<nav th:replace="~{fragments/fragments :: navfragment('dashboard')}"></nav>

<main>

    <div class="dashboard-hero">

        <p class="page-subtitle">Oversigt</p>

        <h1 class="welcome-heading" th:if="${userName != null}" th:text="'Velkommen, ' + ${userName}">Velkommen</h1>
    </div>

    <div class="stat-cards">

        <a class="stat-card" th:href="@{/projects}">

            <div class="stat-label">Projekter i alt</div>

            <div class="stat-value" th:text="${totalprojects}"></div>

        </a>

        <a class="stat-card" th:href="@{/projects}">

            <div class="stat-label">Afsluttede projekter</div>

            <div class="stat-value" th:text="${completedprojects}"></div>

        </a>

        <a class="stat-card" th:href="@{/projects}">

            <div class="stat-label">Aktive projekter</div>

            <div class="stat-value" th:text="${activeprojects}"></div>

        </a>

    </div>


    <a class="projects-cta" th:href="@{/projects}">Gå til mine projekter</a>

</main>

</body>

</html>
