<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<!-- Bliver replacet af vores header fragment-->
<header th:replace="~{fragments/fragments :: headerfragment}"></header>

<!-- Bliver replacet af vores nav fragment-->
<nav th:replace="~{fragments/fragments :: navfragment}"></nav>

<main>
    <div class="dashboard-hero">
        <p class="page-subtitle">Oversigt</p>
        <h1 class="welcome-heading" th:if="${session.userName != null}" th:text="'Velkommen, ' + ${session.userName}">Velkommen</h1>
    </div>

    <div class="stat-cards">
        <div class="stat-card">
            <div class="stat-label">Projekter i alt</div>
            <div class="stat-value" th:text="${totalprojects}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Afsluttede projekter</div>
            <div class="stat-value" th:text="${completedprojects}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Aktive projekter</div>
            <div class="stat-value" th:text="${activeprojects}"></div>
        </div>
    </div>
</main>
</body>
</html>
