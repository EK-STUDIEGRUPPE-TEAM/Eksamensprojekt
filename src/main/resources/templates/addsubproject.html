<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Opret delprojekt</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/forms.css">
</head>
<body>
<header th:replace="~{fragments/fragments :: headerfragment}"></header>
<nav th:replace="~{fragments/fragments :: navfragment('projects')}"></nav>

<main>
    <h1>Opret delprojekt</h1>

    <form th:action="@{/subproject/add/{projectId}(projectId=${subproject.projectId})}" th:object="${subproject}" method="post">
        <div class="form-group">
            <label>Navn</label>
            <input type="text" th:field="*{name}" maxlength="30" required>
        </div>
        <div class="form-actions">
            <button type="submit">Opret delprojekt</button>
            <a class="btn-cancel" th:href="@{/projects/{id}(id=${projectId})}">Annuller</a>
        </div>
    </form>
</main>
</body>
</html>
