<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EnkelteProjekt</title>
</head>

<body>
<header th:replace="~{fragments/fragments :: headerfragment}"></header>


<h1 th:text="${project.name}"></h1>


<table border="1">

    <tr>
        <th>Beskrivelse</th>
        <td th:text="${project.description}"></td>
    </tr>
    <tr>
        <th>Dato oprettet</th>
        <td th:text="${project.date}"></td>

    </tr>

</table>

<table border="1">


    <tr>
        <th>Kategori</th>
        <th colspan="3">Arbejdstid</th>
        <th colspan="3">Materialer</th>
        <th colspan="3">Økonomi</th>
    </tr>

  <!--vi laver her alle de forskellige kollonneoverskrifter, hvori at de forskellige taskdataer ligger under.
  -->
    <tr>
        <th></th>
        <th>Timer</th>
        <th>Rate</th>
        <th>Total</th>
        <th>Enheder</th>
        <th>Pris pr enhed</th>
        <th>Total</th>
        <th>Budget</th>
        <th>aktuel</th>
        <th>Difference</th>
    </tr>


  <!-- Her finder vi de tilhørende subprojejt til projektet og laver dem som overskrifter-->

    <tr th:each="subproject : ${project.subProjects}">
        <th colspan="10"
            th:text="${subproject.name}"></th>

    </tr>


</table>


</body>
</html>
