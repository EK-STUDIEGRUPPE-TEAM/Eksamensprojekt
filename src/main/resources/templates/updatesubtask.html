<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rediger delopgave</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/forms.css">
</head>
<body>
<header th:replace="~{fragments/fragments :: headerfragment}"></header>
<nav th:replace="~{fragments/fragments :: navfragment}"></nav>

<main>
    <h1>Rediger delopgave</h1>

    <!-- update formlen der sendes til saveUpdate som gemmer ændringer til databasen-->
    <form th:action="@{/subtask/saveUpdate}" th:object="${subtask}" method="post">
        <!-- Vi henter først id og taskId så vores update gemmer den rigtige subtask og på den rigtige task-->
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{taskId}">

        <div class="form-group">
            <label>Opgavetitel</label>
            <input type="text" th:field="*{name}">
        </div>
        <div class="form-group">
            <label>Beskrivelse</label>
            <input type="text" th:field="*{description}">
        </div>
        <div class="form-group">
            <label>Estimerede timer</label>
            <input type="number" th:field="*{estimatedHours}" step=".01">
        </div>
        <div class="form-group">
            <label>Status</label>
            <select th:field="*{status}">
                <option value="TODO">Todo</option>
                <option value="IN_PROGRESS">Aktiv</option>
                <option value="DONE">Færdig</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit">Gem ændringer</button>
            <!-- Tilbage knap sender brugeren til task oversigten-->
            <a class="btn-cancel" th:href="@{/task/{taskId}(taskId=${subtask.taskId})}">Tilbage</a>
        </div>
    </form>
</main>
</body>
</html>
